
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Migration | Curated with Care</title>
</head>

<body style="font-family: Arial; padding: 25px; background: #f8f5f1;">

  <h1>Product Migration</h1>

  <p>Checking your existing product catalogue...</p>

  <p id="status">Please wait.</p>

  <button id="migrateButton" disabled>
    Transfer Products
  </button>

  <pre id="results"></pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>

  <script>
    const status = document.getElementById("status");
    const button = document.getElementById("migrateButton");
    const results = document.getElementById("results");

    let existingProducts = [];

    async function prepareMigration() {
      try {
        const { data: userData, error: userError } =
          await supabaseClient.auth.getUser();

        if (userError || !userData.user) {
          throw new Error("Please log in to your admin account first.");
        }

        if (userData.user.app_metadata.role !== "admin") {
          throw new Error("Administrator access is required.");
        }

        const response = await fetch("js/script.js");

        if (!response.ok) {
          throw new Error("Could not load script.js.");
        }

        const source = await response.text();

        const match = source.match(
          /const products = (\[[\s\S]*?\n\]);/
        );

        if (!match) {
          throw new Error("Could not find the product catalogue.");
        }

        existingProducts = Function(
          '"use strict"; return (' + match[1] + ');'
        )();

        status.textContent =
          existingProducts.length +
          " products found. Ready for your review.";

        results.textContent = existingProducts.map(
          product => product.id + " — " + product.name
        ).join("\n");

        button.disabled = existingProducts.length !== 9;

      } catch (error) {
        status.textContent = "Could not prepare migration.";
        results.textContent = error.message;
      }
    }

    button.addEventListener("click", async () => {
      button.disabled = true;

      try {
        const { data: existingRows, error: checkError } =
          await supabaseClient
            .from("products")
            .select("id");

        if (checkError) throw checkError;

        if (existingRows.length > 0) {
          throw new Error(
            "Supabase already contains products. No transfer was made."
          );
        }

        const productsToTransfer = existingProducts.map(product => ({
          ...product,
          is_active: true
        }));

        const { data, error } = await supabaseClient
          .from("products")
          .insert(productsToTransfer)
          .select("id, name");

        if (error) throw error;

        status.textContent =
          "Successfully transferred " + data.length + " products.";

        results.textContent = JSON.stringify(data, null, 2);

      } catch (error) {
        status.textContent = "Transfer stopped.";
        results.textContent = error.message;
        button.disabled = false;
      }
    });

    prepareMigration();
  </script>

</body>
</html>
